<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL | STABLE-v3.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    <style>
        body { background: #020617; height: 100vh; overflow: hidden; font-family: 'JetBrains Mono', monospace; color: #94a3b8; margin: 0; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .content-layer { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem; }
        .glass-ui { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(168, 85, 247, 0.2); }
        .clock-glitch { font-weight: 800; color: #f8fafc; text-shadow: 2px 0 #7c3aed, -2px 0 #0ea5e9; }
        input[type=range] { accent-color: #a855f7; cursor: pointer; }
        /* 旋轉裝飾 */
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 20s linear infinite; }
        .animate-spin-reverse { animation: spin-slow 12s linear infinite reverse; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="content-layer">
        <header class="flex justify-between items-start">
            <div class="glass-ui p-6 rounded-2xl">
                <div id="clock" class="clock-glitch text-6xl">00:00:00</div>
                <div class="flex items-center gap-4 mt-2">
                    <span id="date" class="text-xs tracking-widest opacity-60">SYSTEM INITIALIZING...</span>
                    <span id="weather-info" class="text-xs tracking-widest text-blue-400 font-bold border-l border-white/20 pl-4">MACAU / --°C</span>
                </div>
            </div>
            <div class="glass-ui px-6 py-4 rounded-2xl flex flex-col items-end">
                <div class="text-[10px] uppercase tracking-[0.3em] text-purple-400 mb-1 font-bold">Signal Channel</div>
                <div class="flex items-center gap-3">
                    <span class="text-sm font-bold text-slate-100">FM 99.5</span>
                    <div id="status-dot" class="w-2.5 h-2.5 bg-slate-600 rounded-full"></div>
                </div>
            </div>
        </header>

        <main class="flex-1 flex flex-col items-center justify-center relative">
            <div class="relative w-[320px] h-[320px] lg:w-[450px] lg:h-[450px] flex items-center justify-center">
                <div class="absolute inset-0 rounded-full border border-purple-500/10 animate-spin-slow"></div>
                <div class="absolute inset-8 rounded-full border-t border-l border-blue-500/20 animate-spin-reverse"></div>
                
                <canvas id="visualizer" class="absolute inset-0 w-full h-full"></canvas>
                
                <button id="play-btn" class="z-30 w-28 h-28 bg-slate-950 border border-purple-500/40 rounded-full flex items-center justify-center hover:bg-purple-900/20 transition-all shadow-[0_0_50px_rgba(168,85,247,0.2)] group">
                    <svg id="icon-play" class="w-12 h-12 fill-purple-500 ml-2 group-hover:scale-110 transition-all" viewBox="0 0 20 20"><path d="M4.5 2.691l12.5 7.309-12.5 7.309z"></path></svg>
                    <svg id="icon-pause" class="hidden w-12 h-12 fill-purple-500 group-hover:scale-110 transition-all" viewBox="0 0 20 20"><path d="M5 4h3v12H5V4zm7 0h3v12h-3V4z"></path></svg>
                </button>
            </div>

            <div class="mt-10 w-64 glass-ui p-3 rounded-full flex items-center gap-4">
                <svg class="w-4 h-4 opacity-50" fill="currentColor" viewBox="0 0 20 20"><path d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217z"></path></svg>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" class="w-full h-1 bg-slate-800 rounded-full appearance-none">
            </div>
        </main>

        <footer class="w-full glass-ui rounded-xl overflow-hidden h-14 border-purple-500/30">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
                {
                    "symbols": [
                        {"proName": "FOREXCOM:SPX500", "title": "S&P 500"},
                        {"proName": "FOREXCOM:NSXUSD", "title": "Nasdaq 100"},
                        {"proName": "HSI:HSI", "title": "恆生指數"},
                        {"proName": "HSI:HSTECH", "title": "科技指數"}
                    ],
                    "colorTheme": "dark", "isTransparent": true, "displayMode": "adaptive", "locale": "zh_TW"
                }
                </script>
            </div>
        </footer>
    </div>

    <audio id="audio" crossorigin="anonymous" preload="auto"></audio>

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play-btn');
        const statusDot = document.getElementById('status-dot');
        const streamUrl = 'https://fm995.ddns.net/hls1/fm995.m3u8';

        // --- 1. 時間與天氣 (修正邏輯) ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
            document.getElementById('date').innerText = now.toLocaleDateString('zh-TW', { weekday: 'long', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function updateWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=22.19&longitude=113.54&current_weather=true');
                const data = await res.json();
                document.getElementById('weather-info').innerText = `MACAU / ${data.current_weather.temperature}°C`;
            } catch(e) { console.error("Weather Update Failed"); }
        }
        updateWeather(); 
        setInterval(updateWeather, 600000);

        // --- 2. 矩陣粒子背景 ---
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        let particles = [];
        function resize() { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class P {
            constructor() { this.init(); }
            init() { this.x = Math.random()*bgCanvas.width; this.y = Math.random()*bgCanvas.height; this.v = 0.3; }
            draw() {
                this.y += this.v; if(this.y > bgCanvas.height) this.y = 0;
                bgCtx.fillStyle = "rgba(139, 92, 246, 0.3)";
                bgCtx.fillRect(this.x, this.y, 1.5, 1.5);
            }
        }
        for(let i=0; i<150; i++) particles.push(new P());
        function anim() {
            bgCtx.fillStyle = "rgba(2, 6, 23, 0.2)";
            bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);
            particles.forEach(p => p.draw());
            requestAnimationFrame(anim);
        }
        anim();

        // --- 3. HLS 與音訊播放 (強化點擊回應) ---
        let audioCtx, analyser, source;
        const hls = new Hls();

        function initHls() {
            if (Hls.isSupported()) {
                hls.loadSource(streamUrl);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    statusDot.className = "w-2.5 h-2.5 bg-green-500 rounded-full shadow-[0_0_12px_#22c55e]";
                });
            }
        }
        initHls();

        function startVisualizer() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 256;
            
            const vCanvas = document.getElementById('visualizer');
            const vCtx = vCanvas.getContext('2d');
            const render = () => {
                requestAnimationFrame(render);
                const data = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(data);
                vCanvas.width = vCanvas.offsetWidth * 2;
                vCanvas.height = vCanvas.offsetHeight * 2;
                const cX = vCanvas.width/2, cY = vCanvas.height/2;
                for (let i = 0; i < data.length; i++) {
                    const h = data[i] * 0.8;
                    const a = (i * 2 * Math.PI) / data.length;
                    vCtx.strokeStyle = `hsla(${280 + i}, 70%, 60%, ${h/255})`;
                    vCtx.lineWidth = 3;
                    vCtx.beginPath();
                    vCtx.moveTo(cX + Math.cos(a)*110, cY + Math.sin(a)*110);
                    vCtx.lineTo(cX + Math.cos(a)*(110+h), cY + Math.sin(a)*(110+h));
                    vCtx.stroke();
                }
            };
            render();
        }

        playBtn.onclick = async () => {
            try {
                if (audio.paused) {
                    await audio.play();
                    startVisualizer();
                    if(audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
                    document.getElementById('icon-play').classList.add('hidden');
                    document.getElementById('icon-pause').classList.remove('hidden');
                } else {
                    audio.pause();
                    document.getElementById('icon-play').classList.remove('hidden');
                    document.getElementById('icon-pause').classList.add('hidden');
                }
            } catch (err) {
                console.error("播放失敗:", err);
                alert("播放失敗，請檢查網路或直播流是否在線。");
            }
        };

        document.getElementById('volume-slider').oninput = (e) => audio.volume = e.target.value;
    </script>
</body>
</html>
